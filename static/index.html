<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pib — Control Panel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/common.css">
  <style>
    /* ─── Servo Card ─── */
    .servo-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 1.1rem;
      transition: all 0.25s ease;
      animation: fadeInUp 0.4s ease forwards;
      opacity: 0;
    }
    .servo-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .servo-card.disabled {
      opacity: 0.45;
    }
    .servo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .servo-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-primary);
    }
    .servo-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .servo-chip {
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      background: var(--surface);
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
    }
    .position-display {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      margin: 0.5rem 0;
      letter-spacing: -0.03em;
    }
    .position-display .unit { font-size: 1rem; color: var(--text-muted); }
    .current-reading {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .current-reading i { color: var(--warning); }
    .slider-row {
      margin: 0.6rem 0;
    }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.2rem;
    }
    .servo-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.6rem;
    }
    .servo-actions .btn-glass { padding: 0.35rem 0.65rem; font-size: 0.78rem; }
    .num-input {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.82rem;
    }

    /* ─── Actions Bar ─── */
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .actions-bar .spacer { flex: 1; }

    /* ─── Preset Section ─── */
    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .preset-row .form-control-dark,
    .preset-row .select-dark { flex: 1; min-width: 140px; }

    /* ─── Grid ─── */
    .servo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 0.85rem;
    }

    /* Staggered animation */
    .servo-grid .servo-card:nth-child(1) { animation-delay: 0.02s; }
    .servo-grid .servo-card:nth-child(2) { animation-delay: 0.04s; }
    .servo-grid .servo-card:nth-child(3) { animation-delay: 0.06s; }
    .servo-grid .servo-card:nth-child(4) { animation-delay: 0.08s; }
    .servo-grid .servo-card:nth-child(5) { animation-delay: 0.10s; }
    .servo-grid .servo-card:nth-child(6) { animation-delay: 0.12s; }
    .servo-grid .servo-card:nth-child(7) { animation-delay: 0.14s; }
    .servo-grid .servo-card:nth-child(8) { animation-delay: 0.16s; }
    .servo-grid .servo-card:nth-child(9) { animation-delay: 0.18s; }
    .servo-grid .servo-card:nth-child(10) { animation-delay: 0.20s; }
    .servo-grid .servo-card:nth-child(11) { animation-delay: 0.22s; }
    .servo-grid .servo-card:nth-child(12) { animation-delay: 0.24s; }
    .servo-grid .servo-card:nth-child(13) { animation-delay: 0.26s; }
    .servo-grid .servo-card:nth-child(14) { animation-delay: 0.28s; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
      <span class="navbar-brand">
        <i class="bi bi-robot"></i> Pib Control
      </span>
      <div style="display:flex;align-items:center;gap:0.75rem">
        <span id="status" class="status-badge status-disconnected">
          <span class="dot"></span> Connecting…
        </span>
        <span id="current-display" class="current-badge" style="display:none">
          <i class="bi bi-lightning-charge-fill"></i>
          <span id="current-value">0</span> mA
        </span>
        <div class="nav-links">
          <a href="/discover" class="nav-link-btn"><i class="bi bi-search"></i> Discover</a>
          <a href="/calibrate" class="nav-link-btn"><i class="bi bi-gear"></i> Calibrate</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="content-wrap">
    <!-- Quick Actions -->
    <div class="actions-bar">
      <button id="btn-enable-all" class="btn-glass btn-success-glass"><i class="bi bi-play-circle-fill"></i> Enable All</button>
      <button id="btn-disable-all" class="btn-glass btn-warning-glass"><i class="bi bi-pause-circle-fill"></i> Disable All</button>
      <button id="btn-zero-all" class="btn-glass btn-info-glass"><i class="bi bi-arrow-clockwise"></i> Zero All</button>
      <button id="btn-wave" class="btn-glass btn-accent"><i class="bi bi-hand-index-fill"></i> Wave</button>
      <button id="btn-refresh" class="btn-glass"><i class="bi bi-arrow-repeat"></i> Refresh</button>
      <span class="spacer"></span>
      <button id="btn-stop" class="btn-emergency"><i class="bi bi-octagon-fill"></i> EMERGENCY STOP</button>
    </div>

    <!-- Presets -->
    <div class="glass-card glass-card-sm" style="margin-bottom:1.25rem">
      <div class="section-title"><i class="bi bi-bookmarks-fill"></i> Pose Presets</div>
      <div class="preset-row">
        <select id="preset-list" class="select-dark"><option value="">Select a preset…</option></select>
        <button id="load-preset" class="btn-glass btn-accent"><i class="bi bi-box-arrow-in-down"></i> Load</button>
        <input id="preset-name-input" type="text" class="form-control-dark" placeholder="New preset name…">
        <button id="save-preset" class="btn-glass btn-success-glass"><i class="bi bi-floppy-fill"></i> Save</button>
        <button id="delete-preset" class="btn-glass btn-danger-glass"><i class="bi bi-trash3-fill"></i> Delete</button>
      </div>
    </div>

    <!-- Servo Grid -->
    <div class="section-title"><i class="bi bi-sliders2"></i> Servo Controls</div>
    <div class="servo-grid" id="servo-grid"></div>

    <div class="footer">
      Pib Humanoid Robot Control • Socket.IO Real-time
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
