<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pib — Calibration</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/common.css">
  <style>
    .wizard-wrap {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    .step-label {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .servo-hero {
      text-align: center;
      padding: 2rem;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(129,140,248,0.1) 0%, rgba(52,211,153,0.08) 100%);
      border: 1px solid rgba(129,140,248,0.15);
      margin: 1.25rem 0;
    }

    .servo-hero .live-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--success);
      border-radius: 50%;
      margin-right: 6px;
      animation: statusPulse 2s infinite;
      box-shadow: 0 0 8px var(--success-glow);
    }

    .servo-hero .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--success);
      margin-bottom: 0.75rem;
    }

    .servo-hero h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0.25rem 0 0.4rem;
    }

    .servo-hero .meta-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .angle-big {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.04em;
      margin: 0.75rem 0;
    }

    .angle-big .unit { font-size: 1.5rem; color: var(--text-muted); }

    .controls-section {
      margin: 1.25rem 0;
    }

    .controls-section label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .nudge-group {
      display: flex;
      gap: 0.4rem;
      margin: 0.75rem 0;
    }
    .nudge-group .btn-glass { flex: 1; justify-content: center; }

    .trim-section {
      margin: 1rem 0;
    }

    .trim-section .helper {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    .enable-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1rem 0;
    }

    .enable-row span {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .wizard-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .info-box {
      margin-top: 1.25rem;
      padding: 1rem;
      border-radius: var(--radius-sm);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.15);
      font-size: 0.8rem;
      color: var(--info);
      line-height: 1.5;
    }

    .info-box i { margin-right: 4px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
      <span class="navbar-brand">
        <i class="bi bi-gear-fill"></i> Calibration
      </span>
      <div class="nav-links">
        <a href="/" class="nav-link-btn"><i class="bi bi-arrow-left"></i> Control Panel</a>
        <a href="/discover" class="nav-link-btn"><i class="bi bi-search"></i> Discover</a>
      </div>
    </div>
  </nav>

  <div class="content-wrap">
    <div class="wizard-wrap">
      <div class="glass-card">
        <!-- Progress -->
        <div class="step-label" id="progress-text">0 / 0</div>
        <div class="progress-dark">
          <div class="bar" id="progress-bar" style="width:0%"></div>
        </div>

        <!-- Servo Hero -->
        <div class="servo-hero">
          <div class="live-badge"><span class="live-dot"></span> LIVE</div>
          <h2 id="servo-name">---</h2>
          <div class="meta-text" id="servo-meta">Servo - of -</div>
          <div class="angle-big"><span id="angle-display">0.0</span><span class="unit">°</span></div>
        </div>

        <!-- Controls -->
        <div class="controls-section">
          <label>Position</label>
          <input type="range" id="position-slider" class="range-dark" min="-90" max="90" step="1" value="0">
        </div>

        <div class="nudge-group">
          <button class="btn-glass" id="btn-minus-10">−10°</button>
          <button class="btn-glass" id="btn-minus-1">−1°</button>
          <button class="btn-glass btn-accent" id="btn-zero">0°</button>
          <button class="btn-glass" id="btn-plus-1">+1°</button>
          <button class="btn-glass" id="btn-plus-10">+10°</button>
        </div>

        <div class="trim-section">
          <label>Trim Offset</label>
          <input type="number" id="trim-input" class="form-control-dark" value="0" step="0.5" style="width:100%">
          <div class="helper">Offset adjusts the mechanical zero point</div>
        </div>

        <div class="enable-row">
          <label class="toggle-switch">
            <input type="checkbox" id="enable-servo">
            <span class="toggle-slider"></span>
          </label>
          <span>Enable Servo</span>
        </div>

        <!-- Navigation -->
        <div class="wizard-nav">
          <button class="btn-glass" id="btn-prev" disabled><i class="bi bi-arrow-left"></i> Previous</button>
          <button class="btn-glass btn-success-glass" id="btn-save-trim"><i class="bi bi-save-fill"></i> Save Trim</button>
          <button class="btn-glass btn-accent" id="btn-next">Next <i class="bi bi-arrow-right"></i></button>
        </div>

        <div class="info-box">
          <i class="bi bi-info-circle-fill"></i>
          Enable the servo, move the slider to find the natural zero position,
          then set a trim offset if needed. Click "Save Trim" to store, then proceed to the next servo.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io();

    const servoNameEl = document.getElementById("servo-name");
    const servoMetaEl = document.getElementById("servo-meta");
    const angleDisplayEl = document.getElementById("angle-display");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const positionSlider = document.getElementById("position-slider");
    const trimInput = document.getElementById("trim-input");
    const enableCheckbox = document.getElementById("enable-servo");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnSaveTrim = document.getElementById("btn-save-trim");

    let servos = [];
    let currentIndex = 0;
    let trimData = {};

    socket.on("config", (data) => {
      servos = Object.keys(data.servos).sort();
      if (servos.length > 0) loadServo(0);
      updateProgress();
    });

    socket.on("position_update", (d) => {
      if (servos[currentIndex] === d.name) {
        angleDisplayEl.textContent = d.position_deg.toFixed(1);
      }
    });

    socket.on("enable_update", (d) => {
      if (servos[currentIndex] === d.name) {
        enableCheckbox.checked = d.enabled;
      }
    });

    function loadServo(idx) {
      currentIndex = idx;
      const name = servos[idx];
      socket.emit("get_positions");
      servoNameEl.textContent = name.replace(/_/g, " ");
      servoMetaEl.textContent = `Servo ${idx + 1} of ${servos.length}`;
      trimInput.value = trimData[name] || 0;
      positionSlider.value = 0;
      angleDisplayEl.textContent = "0.0";
      updateProgress();
      updateButtons();
    }

    function updateProgress() {
      const pct = servos.length > 0 ? ((currentIndex + 1) / servos.length * 100) : 0;
      progressBar.style.width = `${pct}%`;
      progressText.textContent = `${currentIndex + 1} / ${servos.length}`;
    }

    function updateButtons() {
      btnPrev.disabled = currentIndex === 0;
      btnNext.innerHTML = currentIndex === servos.length - 1
        ? 'Finish <i class="bi bi-check-circle-fill"></i>'
        : 'Next <i class="bi bi-arrow-right"></i>';
    }

    function setPos(deg) {
      const name = servos[currentIndex];
      positionSlider.value = deg;
      angleDisplayEl.textContent = deg.toFixed(1);
      socket.emit("set_position", { name, degree: deg });
    }

    positionSlider.addEventListener("input", () => setPos(parseFloat(positionSlider.value)));
    enableCheckbox.addEventListener("change", () => {
      socket.emit("set_enable", { name: servos[currentIndex], enable: enableCheckbox.checked });
    });

    document.getElementById("btn-minus-10").addEventListener("click", () => setPos(parseFloat(positionSlider.value) - 10));
    document.getElementById("btn-minus-1").addEventListener("click", () => setPos(parseFloat(positionSlider.value) - 1));
    document.getElementById("btn-zero").addEventListener("click", () => setPos(0));
    document.getElementById("btn-plus-1").addEventListener("click", () => setPos(parseFloat(positionSlider.value) + 1));
    document.getElementById("btn-plus-10").addEventListener("click", () => setPos(parseFloat(positionSlider.value) + 10));

    btnSaveTrim.addEventListener("click", () => {
      const name = servos[currentIndex];
      const trim = parseFloat(trimInput.value);
      trimData[name] = trim;
      localStorage.setItem("humanoid_trim", JSON.stringify(trimData));
      socket.emit("set_trim", { name, trim });
      alert(`✓ Trim saved for ${name.replace(/_/g, " ")}: ${trim}°`);
    });

    btnPrev.addEventListener("click", () => { if (currentIndex > 0) loadServo(currentIndex - 1); });
    btnNext.addEventListener("click", () => {
      if (currentIndex < servos.length - 1) {
        loadServo(currentIndex + 1);
      } else {
        if (confirm("Calibration complete! Return to control panel?")) {
          window.location.href = "/";
        }
      }
    });

    const saved = localStorage.getItem("humanoid_trim");
    if (saved) trimData = JSON.parse(saved);
  </script>
</body>
</html>
